  mode: sync
  category: oms
  docs: https://docs.salesgraph.com/tools/overview
- name: oms_watch_get
  description: Gets one manageable research watch by id.
  inputs:
  - id
  mode: sync
  category: oms
  docs: https://docs.salesgraph.com/tools/overview
- name: oms_watch_cancel
  description: Cancels one manageable research watch by id.
  inputs:
  - id
  mode: sync
  category: oms
  docs: https://docs.salesgraph.com/tools/overview
- name: oms_request_update_opportunity
  description: Requests a human-approved opportunity update. Nothing is written until a person approves.
  inputs:
  - approval request
  mode: sync
  category: oms-actions
  docs: https://docs.salesgraph.com/tools/overview
- name: oms_request_log_rep_note
  description: Requests a human-approved rep note. Nothing is written until a person approves.
  inputs:
  - approval request
  mode: sync
  category: oms-actions
  docs: https://docs.salesgraph.com/tools/overview
- name: oms_request_draft_followup_email
  description: Requests a human-approved follow-up email draft. Nothing is sent until a person approves.
