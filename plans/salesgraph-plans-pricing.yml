note: >
  Salesgraph publishes no public pricing. https://salesgraph.com/pricing returns HTTP 200 but
  renders the WorkOS AuthKit "Sign in" page rather than a plans table — the path exists only
  behind authentication. The marketing site's navigation carries no pricing link at all (Home,
  Industries, About, Dashboard, Careers, Updates, Support, legal), and the developer docs
  describe API keys and quotas without naming a price or a free tier. Access is therefore
  sales-led: an account, and any commercial terms, are negotiated rather than self-served from a
  published catalog. No machine-readable pricing or catalog endpoint is served either.
