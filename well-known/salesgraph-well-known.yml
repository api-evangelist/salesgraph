note: >
  Round 2 (2026-08-13) found a REAL /.well-known/ surface that round 1 missed, on the
  documentation host. docs.salesgraph.com serves an A2A agent card, a Mintlify MCP descriptor,
  and a packaged Agent Skill — all HTTP 200 with real JSON/markdown bodies. The apex and www
  hosts still serve nothing: salesgraph.com is a Next.js app that answers every unknown
  /.well-known/* path with an HTTP 200 text/html app shell (a soft-404), so every one of those
  200s is recorded as real: false and none of them earn a pointer. No security.txt is served on
  any host, so no SecurityTxt pointer is wired.
