overlay: 1.0.0
info:
  title: API Evangelist enhancements for Salesgraph REST API
  version: 1.0.0
extends: openapi/salesgraph-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provenance: >
        Spec generated by the API Evangelist enrichment pipeline from the published Salesgraph
        REST API reference (docs.salesgraph.com/reference/rest-api); the provider's own
        openapi.json is a Mintlify placeholder.
      x-mcp-server: https://salesgraph.com/api/mcp
  - target: $.info
    update:
      x-response-media-type: text/markdown
      x-async-model: run-and-poll (X-Run-Id / X-Run-Status headers; poll /api/v1/runs/{kind}/{id})
