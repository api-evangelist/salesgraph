- aid: salesgraph:salesgraph-status-api
  name: Salesgraph Status API
  description: >-
    A public, unauthenticated JSON status endpoint at /api/status carrying the platform headline,
    overall status, active incident count, a seven-component health array with per-component
    lastCheckedAt timestamps, active incidents, and incident history. It is the same data the
    human status page renders, and the only Salesgraph operation callable without an API key.
  humanURL: https://salesgraph.com/status
  baseURL: https://salesgraph.com/api
