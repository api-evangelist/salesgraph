- aid: salesgraph:salesgraph-mcp-server
  name: Salesgraph MCP Server
  description: >-
    The remote MCP streamable-HTTP server at salesgraph.com/api/mcp, authenticated with an
    sg_live_ API key. It exposes 19 documented tools across three families — GTM commands
    (research, competitors, gtm_audit, org_audit, get_run_status, list_capabilities, help), OMS
    data tools, and human-approval action tools. There is no stdio package: the only agent
    surface is this hosted endpoint.
  humanURL: https://docs.salesgraph.com/tools/overview
  baseURL: https://salesgraph.com/api/mcp
