- aid: salesgraph:salesgraph-oms-api
  name: Salesgraph OMS API
  description: >-
    The Opportunity Management System — query the organization's own visible sales objects,
    traverse their relationships, inspect where each value came from, and manage continuous,
    cost-capped research watches on Accounts and Opportunities. The only Salesgraph endpoint
    family that returns JSON rather than markdown, and the only one carrying an idempotency key.
    Write intent is never applied directly: an action request returns 202 and waits for a human
    to approve it.
  humanURL: https://docs.salesgraph.com/reference/rest-api
  baseURL: https://salesgraph.com/api/v1
