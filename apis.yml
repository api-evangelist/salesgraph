aid: salesgraph
name: Salesgraph
description: >-
  Salesgraph is a Y Combinator-backed revenue automation platform that uses proactive AI agents
  to accelerate enterprise sales cycles — automating pre-call research, discovery analysis,
  follow-up communications, and collateral generation (business cases, mutual action plans, ROI
  calculators) from a shared organizational context graph. Beyond the product, Salesgraph ships a
  developer surface: a published MCP (Model Context Protocol) streamable-HTTP server at
  salesgraph.com/api/mcp and an equivalent REST API under /api/v1, both API-key authenticated,
  exposing 19 tools across GTM research and audit commands (research, competitors, gtm_audit,
  org_audit) that return cited markdown, and an OMS (Opportunity Management System) family that
  returns JSON — searching, traversing and tracing the provenance of the organization's own
  Accounts and Opportunities, and putting cost-capped continuous research watches on them. OMS
  write intent always routes through a human approval request rather than a direct write. It also
  serves an A2A agent card and a packaged Agent Skill from its docs host, and a public
  unauthenticated status API. It integrates with Salesforce, HubSpot, Attio, Outreach, Salesloft,
  Gong, and others, targeting mid-market and enterprise revenue teams in dev tools, SaaS, and
  cybersecurity.
