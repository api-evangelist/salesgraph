aid: salesgraph
name: Salesgraph
description: >-
  Salesgraph is a Y Combinator-backed revenue automation platform that uses proactive AI agents
  to accelerate enterprise sales cycles — automating pre-call research, discovery analysis,
  follow-up communications, and collateral generation (business cases, mutual action plans, ROI
  calculators) from a shared organizational context graph. Beyond the product, Salesgraph ships a
  developer surface: a published MCP (Model Context Protocol) streamable-HTTP server at
  salesgraph.com/api/mcp and an equivalent REST API under /api/v1, both API-key authenticated,
  exposing GTM research and audit tools (research, competitors, gtm_audit, org_audit) that return
  cited markdown. It integrates with Salesforce, HubSpot, Attio, Outreach, Salesloft, Gong, and
  others, targeting mid-market and enterprise revenue teams in dev tools, SaaS, and cybersecurity.
