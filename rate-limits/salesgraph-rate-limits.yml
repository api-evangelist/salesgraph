rate_limits: []
note: >
  Salesgraph documents that rate limiting EXISTS but publishes no number, no window, and no
  response headers. The errors reference states only that "audit and command endpoints are rate
  limited per organization" and that exceeding the limit returns "a rate-limit response — back
  off and retry", directing sustained high-volume users to support@salesgraph.com. The REST
  reference's status table names 429 as the exhaustion status. Nothing publishes a quota, a
  window, a burst allowance, a Retry-After value, or any X-RateLimit-*/RateLimit-* header, so an
  agent cannot budget its calls or compute a correct backoff from the contract — it can only
  retry and observe. limit_count is an honest zero, not a missing measurement.
documented:
  exists: true
  scope: per-organization
  applies_to: [audit endpoints, command endpoints]
  exhaustion_status: 429
  response_headers: none documented
  retry_after: not documented
  window: not documented
  limit: not documented
  burst: not documented
  guidance: back off and retry; contact support@salesgraph.com for sustained high-volume needs
